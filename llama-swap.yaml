# The model table behind :8100 -- THE table, since 18 Sep 2026: the unit
# on ac-box runs `llama-swap -config <checkout>/llama-swap.yaml` from the
# flox environment (.flox/env/manifest.toml), and modules/agent-hub.nix no
# longer generates one. Written by hand from the JSON the module used to
# generate, read off the box on 17 Sep 2026: same names, same flags in the
# same order, same concurrency set (six models then; the three image
# backends left 20 Sep 2026, homelab-b9u, and utility joined the same
# day, homelab-8r5); `${env.*}` macros where the module had store paths
# and host constants. hosts/ac-box/configuration.nix still carries the per-model reasoning (which quant,
# why these flags) beside values nothing reads any more; when it moves,
# it moves here.
#
# Run it with the environment's binaries on PATH, i.e. from `flox activate`:
#   flox activate -- llama-swap -config llama-swap.yaml -listen 127.0.0.1:18900
# Every `${env.AGENT_HUB_*}` here is a host fact: on the box the unit's
# Environment= (homelab's stub) sets all of them and the manifest's hook sets
# none; in a developer's shell the hook fills in laptop values (the manifest
# says which). FLOX_ENV is flox's own. llama-swap refuses to load if one is
# missing -- `environment variable 'X' is not set`, exit 1 -- which is the
# check you want.
#
# `${PORT}` is llama-swap's own macro, the loopback port it assigns a
# backend; it must stay literal.

# Loopback ports for the backends, from AGENT_HUB_BACKEND_PORT up.
startPort: ${env.AGENT_HUB_BACKEND_PORT}

# How long a backend may take to answer its checkEndpoint after start.
# llama-swap's default is 120 s; a cold 85 GB model off NVMe plus ik's
# run-time repack is under a minute on ac-box, but a box under memory
# pressure can take longer and a timeout here is a spurious "failed to load".
healthCheckTimeout: 600

macros:
  llama_server: "${env.FLOX_ENV}/bin/llama-server"
  models: "${env.AGENT_HUB_MODELS}"
  threads: "${env.AGENT_HUB_THREADS}"
  ctx: "${env.AGENT_HUB_CTX}"
  # The module's `llm.extraArgs`, appended to every llama backend after the
  # flags it emits. hosts/ac-box/configuration.nix argues each one: -rtr
  # (repack at load; disables mmap so the model is anonymous memory under
  # the unit's NUMAPolicy), --flash-attn on, --jinja (tool calls; without
  # it every request carrying `tools` is a 500), --metrics (per-backend
  # /metrics on the loopback port; not scraped yet).
  llama_extra: "-rtr --flash-attn on --jinja --metrics"

models:
  # Qwen3-Coder-Next, 80B total / 3B active MoE, Q8_0, four shards; shard 1
  # is named and llama.cpp finds the rest. --cache-ram 12288: the
  # server-side prompt cache sized for ~five 32k agent conversations.
  #
  # Two slots (--parallel 2), each ${ctx} = 32768 of context: --ctx-size is
  # the TOTAL this build splits across slots, and a llama-swap macro cannot
  # multiply, so the total is literal -- change both when ${ctx} changes.
  # One slot was the bottleneck on 18 Sep 2026 (homelab-7bu): with a
  # second agent session on this backend, 66 of 174 completions in one hour
  # queued behind another request and a four-minute bead-loop review took
  # 40. Decode on this MoE is memory-bandwidth bound, so batching two
  # sequences reads the weights once for both; prefill (compute bound)
  # shares the 23 threads, no worse than the serial wait it replaces. KV for
  # a second 32k slot is small: Qwen3-Next's hybrid attention keeps few
  # full-attention layers. Not the instruct backend: one client at a time.
  coder:
    cmd: >
      ${llama_server} --model ${models}/Qwen3-Coder-Next-Q8_0-00001-of-00004.gguf
      --host 127.0.0.1 --parallel 2 --ctx-size 65536 --threads ${threads}
      ${llama_extra} --cache-ram 12288 --port ${PORT}
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    aliases: []
    ttl: 0
    name: coder
    description: "Qwen3-Coder-Next 80B-A3B Q8_0 -- code. Chat tab."
    metadata:
      kind: llama

  # The same architecture tuned for instructions and prose. The aliases are
  # the hosted model names inquire-platform hard-codes, so its Anthropic SDK
  # pointed at this port lands here unchanged.
  instruct:
    cmd: >
      ${llama_server} --model ${models}/Qwen3-Next-80B-A3B-Instruct-Q8_0.gguf
      --host 127.0.0.1 --ctx-size ${ctx} --threads ${threads}
      ${llama_extra} --cache-ram 8192 --port ${PORT}
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    aliases:
      - claude-sonnet-4-6
      - claude-haiku-4-5-20251001
    ttl: 0
    name: instruct
    description: "Qwen3-Next-80B-A3B-Instruct Q8_0 -- prose, judgement, inquire-platform scoring. Chat tab."
    metadata:
      kind: llama

  # Embeddings for Qdrant: llama-server in embedding-only mode, both batch
  # sizes raised to the context so a chunk that fits the context embeds in
  # one call. Its own --ctx-size 8192 (the module's per-model contextSize),
  # the unit-wide thread count (embedding is prefill, prefill is
  # compute-bound). --jinja is inherited and ignored: no chat endpoint.
  embed:
    cmd: >
      ${llama_server} --model ${models}/Qwen3-Embedding-0.6B-Q8_0.gguf
      --host 127.0.0.1 --ctx-size 8192 --threads ${threads}
      --embedding --batch-size 8192 --ubatch-size 8192
      ${llama_extra} --port ${PORT}
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    aliases: []
    ttl: 0
    name: embed
    description: "Qwen3-Embedding-0.6B Q8_0 -- 1024-dim embeddings for Qdrant on :6333. POST /v1/embeddings."
    metadata:
      kind: embedding

  # Utility: Qwen3-4B-Instruct-2507, dense, Q8_0 (4.3 GB) -- the cheap calls
  # (opencode's small_model: titles, summaries; pre-checks) that otherwise
  # take one of coder's two slots. Chosen 20 Sep 2026 (homelab-8r5) because
  # it was already on the box; measured there with bench.sh inside
  # background.slice, the two 80Bs resident (-rtr, -fa 1, pp1024/tg32):
  #     t=4   pp  33 tok/s   tg  6.3
  #     t=8   pp  64 tok/s   tg  9.6
  #     t=23  pp 162 tok/s   tg 11.6
  # Decode is bandwidth-bound: a dense 4B at Q8 reads all 4.3 GB per
  # token, so ~12 tok/s is this box's ceiling for it -- barely above the
  # 80B MoE's 13 (3B active). A 200-token answer is ~20 s, not the < 5 s
  # the bead hoped for; a title is ~3 s. If that matters, the swap is one
  # line: Q4_K_M (~2.5 GB, ~20 tok/s expected) or gpt-oss-20b (3.6B
  # active, ~25). Eight threads, not the unit's 23: decode loses 17 % and
  # prefill 60 %, and coder keeps 15 cores for its own prefill while this
  # one answers -- the point is that a cheap call never queues behind a
  # review, not that it is fast. Own ctx (16k is plenty for a summary) and
  # a small prompt cache; KV at 16k with FA is ~1.2 GiB, ~6 GiB resident.
  utility:
    cmd: >
      ${llama_server} --model ${models}/Qwen3-4B-Instruct-2507-Q8_0.gguf
      --host 127.0.0.1 --ctx-size 16384 --threads 8
      ${llama_extra} --cache-ram 1024 --port ${PORT}
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    aliases: []
    ttl: 0
    name: utility
    description: "Qwen3-4B-Instruct-2507 Q8_0 -- titles, summaries, pre-checks; ~12 tok/s. Chat tab."
    metadata:
      kind: llama

# All four stay resident together (the module's `concurrent` set, minus
# the image model it also held: the image backends left on 20 Sep 2026,
# homelab-b9u -- generating evicted both 80Bs, a minute's reload and a cold
# prompt cache for the next review -- and plus utility, homelab-8r5).
# Top-level `matrix:` is the form the module wrote and 224 reads (a backwards-compat alias of
# routing.router.settings.matrix).
matrix:
  vars:
    v0: coder
    v1: embed
    v2: instruct
    v3: utility
  sets:
    set0: "v0 & v2 & v1 & v3"
