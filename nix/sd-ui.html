<!doctype html>
<!--
  A one-file page for stable-diffusion.cpp's sd-server, passed to it with
  --serve-html-path by the agent-hub module for every kind = "image" model.
  nixpkgs' sd-server has no embedded frontend (its root answers 34 bytes of
  nothing), and llama-swap's /ui playground is a chat client, so without this
  the only way to get an image was curl.

  It POSTs to v1/images/generations RELATIVE to its own URL, so it works both
  straight on the backend and behind llama-swap's /upstream/<model>/ prefix.
  On ac-box a 512x512 takes ~4 minutes and 1024x1024 ~15 (CPU only), so the
  page's job is mostly to keep you informed while you wait.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-hub images</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.4 system-ui, sans-serif; }
  body { max-width: 62rem; margin: 0 auto; padding: 1.5rem 1rem; }
  h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  form { display: grid; gap: .75rem; grid-template-columns: 1fr; }
  textarea { width: 100%; min-height: 5rem; font: inherit; padding: .5rem; box-sizing: border-box; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; }
  label { display: grid; gap: .25rem; font-size: .9rem; }
  select, input { font: inherit; padding: .35rem; }
  button { font: inherit; padding: .5rem 1.2rem; cursor: pointer; }
  button:disabled { cursor: wait; opacity: .6; }
  #status { min-height: 1.4em; opacity: .8; }
  #out { display: grid; gap: 1rem; margin-top: 1.5rem; }
  figure { margin: 0; }
  figure img { max-width: 100%; height: auto; display: block; }
  figcaption { font-size: .85rem; opacity: .8; margin-top: .25rem; white-space: pre-wrap; }
  .err { color: #c33; }
</style>
</head>
<body>
<h1>agent-hub images</h1>
<form id="f">
  <textarea id="prompt" placeholder="a red vintage race car on a wet track at dusk, cinematic photo" required></textarea>
  <div class="row">
    <label>Size
      <select id="size">
        <option value="512x512">512×512 (~4 min)</option>
        <option value="768x512">768×512</option>
        <option value="512x768">512×768</option>
        <option value="768x768">768×768 (~9 min)</option>
        <option value="1024x1024">1024×1024 (~15 min)</option>
      </select>
    </label>
    <label>Steps <input id="steps" type="number" min="1" max="30" value="8" style="width:5rem"></label>
    <label>Seed <input id="seed" type="number" value="-1" style="width:7rem" title="-1 = random"></label>
    <button id="go" type="submit">Generate</button>
  </div>
  <div id="status"></div>
</form>
<div id="out"></div>
<script>
  const $ = id => document.getElementById(id);
  const f = $('f'), go = $('go'), status = $('status'), out = $('out');
  let timer;
  function tick(t0) { status.textContent = `generating… ${Math.round((Date.now() - t0) / 1000)} s (CPU only; a 512×512 is about four minutes)`; }
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const prompt = $('prompt').value.trim();
    const steps = +$('steps').value, seed = +$('seed').value;
    // sd-server reads per-request sampler settings from a tag embedded in
    // the prompt; the tag is stripped before generation.
    const extra = { sample_params: { sample_steps: steps }, seed };
    const body = { prompt: `${prompt} <sd_cpp_extra_args>${JSON.stringify(extra)}</sd_cpp_extra_args>`, size: $('size').value, n: 1 };
    go.disabled = true;
    const t0 = Date.now();
    tick(t0); timer = setInterval(() => tick(t0), 1000);
    try {
      const r = await fetch('v1/images/generations', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${(await r.text()).slice(0, 300)}`);
      const j = await r.json();
      const secs = Math.round((Date.now() - t0) / 1000);
      for (const d of j.data || []) {
        const fig = document.createElement('figure');
        const img = new Image();
        img.src = `data:image/${j.output_format || 'png'};base64,${d.b64_json}`;
        img.alt = prompt;
        const cap = document.createElement('figcaption');
        cap.textContent = `${prompt}\n${$('size').value}, ${steps} steps, seed ${seed}, ${secs} s`;
        fig.append(img, cap);
        out.prepend(fig);
      }
      status.textContent = `done in ${secs} s`;
    } catch (e) {
      status.innerHTML = `<span class="err">${e.message}</span>`;
    } finally {
      clearInterval(timer);
      go.disabled = false;
    }
  });
</script>
</body>
</html>
