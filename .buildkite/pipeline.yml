# GitHub push -> this file, on the ac-box agent (queue=self). Source checks
# only: nothing here touches the box, and nothing here can -- this tree
# reaches ac-box as a flake input of homelab today, and as a flox
# environment once ADR 0009's deploy edge exists (homelab-158.3).
#
# Every step runs under the flox plugin, in the environment
# .flox/env/manifest.toml declares -- the same environment a developer
# activates and the box will run from, and the one homelab's
# scripts/hub-gates.sh reproduces locally with flox pinned to the agent's
# version. The tenant's own gate is scripts/ci_test.sh: llama-swap loads the
# model table with the environment's binaries. The COMPOSITION gate -- does
# ac-box still evaluate? (modules/agent-hub.nix is gone; homelab holds the unit) -- cannot
# run here, because the host that composes it lives in homelab; it runs one
# hop later, in homelab's bump-lock step, before anything is pushed there.
#
# The first build after the manifest lands is slow: the flake package
# (ik_llama.cpp) has no binary in the catalog, so the agent's nix builds it
# from source. The plugin's post-command hook then pushes the environment's
# closure to the MinIO cache (S3_CACHE_PUSH), so every later cold container
# substitutes instead.
#
# ...and on two cores, not four. Build 6 (17 Sep 2026) OOM-killed cc1plus:
# the agent's container sees nproc=4 (batch's two physical cores plus SMT
# siblings), ninja ran -j4 on the fork's iqk template units, and four of
# those exceed batch.slice's 12.5 GiB ceiling. `cores = 2` is the agent's
# setting (ac-host compose/docker-compose.buildkite.yml, since 7d4191f; on
# the running agent since its 18 Sep recreate). This file carried a copy of
# the agent's NIX_CONFIG for one day while the compose change travelled;
# gone now, because a job-level NIX_CONFIG replaces the agent's rather than
# merging with it. Steps run in sequence (depends_on) so one activation
# builds the environment and the other two find it, instead of three
# evaluators contending for the same ceiling.

agents:
  queue: self

env:
  S3_CACHE_BUCKET: flox-binary-cache
  S3_CACHE_ENDPOINT: http://minio:9000
  S3_CACHE_REGION: us-east-1
  S3_CACHE_PUBLIC_KEY: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0= flox-binary-cache-2:ESa71iIsMeX6Wu7EBiXXZlJraWI0HF4xdOF/ivG4UTo="
  S3_CACHE_PUSH: "true"

steps:
  - label: ":flox: llama-swap serves the model table"
    key: test
    command: bash scripts/ci_test.sh
    plugins:
      - imkarrer/flox#main:
          command: bash scripts/ci_test.sh

  - label: ":flox: scripts lint"
    key: lint
    depends_on: test
    command: bash scripts/ci_lint.sh
    plugins:
      - imkarrer/flox#main:
          command: bash scripts/ci_lint.sh

  - label: ":nix: flake evaluates"
    key: check
    depends_on: test
    # Not --no-build. nix/ik-llama-cpp.nix imports files out of its
    # fetched source (callPackage
    # "${src}/.devops/nix/scope.nix"), which is import-from-derivation: the
    # source must be IN the store to evaluate. On a WSL box that has built
    # the packages it already is; on the agent's own /nix it is not, and
    # --no-build turns the fetch into "path is not valid" (build 1, 15 Sep).
    # Without the flag nix fetches the source (once; it stays in the
    # agent's store) and builds nothing -- this flake has no `checks`.
    # Under the plugin for uniformity; nix is the agent's, not the
    # environment's.
    command: nix --extra-experimental-features "nix-command flakes" flake check
    plugins:
      - imkarrer/flox#main:
          command: nix --extra-experimental-features "nix-command flakes" flake check

  - wait: ~

  # No bump-lock trigger any more: since homelab d7d4f58 (18 Sep 2026,
  # homelab-158.11) this tree is not a flake input of the closure. The box
  # takes it only through the environment edge below; homelab's bump-lock
  # step would skip it by name anyway.
  # Second edge, ADR 0009 step 1c (homelab-158.3): stage THIS sha as the
  # tenant's environment on the box. homelab's pipeline routes a build
  # carrying HOMELAB_STAGE_ENVIRONMENT to scripts/hub-queue-environment.sh,
  # which writes /var/lib/homelab/pending-environment-agent-hub.json; the
  # box's agent-hub-environment-pull unit checks the sha out under
  # /var/lib/agent-hub/env, substitutes every path the lock names (never
  # compiles), activates once, records it, and restarts agent-hub-llm.service
  # once the stub is enabled in homelab. While the stub is off this stages
  # and warms only. Same async/soft_fail reasoning as the bump above.
  # HOMELAB_STAGE_BRANCH is required: without it the queue script sees
  # homelab's own branch and the only-main guard passes for the wrong build.
  - trigger: homelab
    label: ":inbox_tray: stage this sha as agent-hub's environment on the box"
    if: build.branch == "main"
    async: true
    soft_fail: true
    build:
      message: "agent-hub ${BUILDKITE_COMMIT} went green: stage the environment"
      env:
        HOMELAB_STAGE_ENVIRONMENT: agent-hub
        HOMELAB_STAGE_REV: "${BUILDKITE_COMMIT}"
        HOMELAB_STAGE_BRANCH: "${BUILDKITE_BRANCH}"
        HOMELAB_STAGE_BUILD: "${BUILDKITE_BUILD_URL}"
