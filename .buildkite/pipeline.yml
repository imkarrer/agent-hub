# GitHub push -> this file, on the ac-box agent (queue=self). Source checks
# only: nothing here touches the box, and nothing here can -- this tree
# reaches ac-box as a flake input of homelab today, and as a flox
# environment once ADR 0009's deploy edge exists (homelab-158.3).
#
# Every step runs under the flox plugin, in the environment
# .flox/env/manifest.toml declares -- the same environment a developer
# activates and the box will run from, and the one homelab's
# scripts/hub-gates.sh reproduces locally with flox pinned to the agent's
# version. The tenant's own gate is scripts/ci_test.sh: llama-swap loads the
# model table with the environment's binaries. The COMPOSITION gate -- does
# ac-box still evaluate with modules/agent-hub.nix at this commit? -- cannot
# run here, because the host that composes it lives in homelab; it runs one
# hop later, in homelab's bump-lock step, before anything is pushed there.
#
# The first build after the manifest lands is slow: the two flake packages
# (ik_llama.cpp, stable-diffusion.cpp) have no binary in the catalog, so
# the agent's nix builds them from source on its four cores. The plugin's
# post-command hook then pushes the environment's closure to the MinIO
# cache (S3_CACHE_PUSH), so every later cold container substitutes instead.

agents:
  queue: self

env:
  S3_CACHE_BUCKET: flox-binary-cache
  S3_CACHE_ENDPOINT: http://minio:9000
  S3_CACHE_REGION: us-east-1
  S3_CACHE_PUBLIC_KEY: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0= flox-binary-cache-2:ESa71iIsMeX6Wu7EBiXXZlJraWI0HF4xdOF/ivG4UTo="
  S3_CACHE_PUSH: "true"

steps:
  - label: ":flox: llama-swap serves the model table"
    key: test
    command: bash scripts/ci_test.sh
    plugins:
      - imkarrer/flox#main:
          command: bash scripts/ci_test.sh

  - label: ":flox: scripts lint"
    key: lint
    command: bash scripts/ci_lint.sh
    plugins:
      - imkarrer/flox#main:
          command: bash scripts/ci_lint.sh

  - label: ":nix: flake evaluates"
    key: check
    # Not --no-build. nix/ik-llama-cpp.nix and nix/stable-diffusion-cpp.nix
    # import files out of their fetched sources (callPackage
    # "${src}/.devops/nix/scope.nix"), which is import-from-derivation: the
    # source must be IN the store to evaluate. On a WSL box that has built
    # the packages it already is; on the agent's own /nix it is not, and
    # --no-build turns the fetch into "path is not valid" (build 1, 15 Sep).
    # Without the flag nix fetches the two sources (once; they stay in the
    # agent's store) and builds nothing -- this flake has no `checks`.
    # Under the plugin for uniformity; nix is the agent's, not the
    # environment's.
    command: nix --extra-experimental-features "nix-command flakes" flake check
    plugins:
      - imkarrer/flox#main:
          command: nix --extra-experimental-features "nix-command flakes" flake check

  - wait: ~

  # Tell homelab this tree moved. Its bump-lock step (scripts/hub-bump-lock.sh
  # there) bumps the `agent-hub` input, runs homelab's gates on the result,
  # and pushes; that push is an ordinary homelab build, whose queue-closure
  # stages the closure, which homelab-deploy applies within minutes unless
  # someone is racing (ADR 0008). So: a green push here is a switched box in
  # about a quarter of an hour, with nobody in the loop. That is the chain
  # the operator asked for on 15 Sep 2026, and the reason this file did not
  # exist before then -- see homelab/docs/architecture.md Part III row 24.
  # It stays until the box runs this tenant from the environment rather
  # than from the module (homelab-158.2/.3); the manifest changes nothing
  # about how the module reaches the box.
  - trigger: homelab
    label: ":arrow_up: bump homelab's lock"
    if: build.branch == "main"
    async: true
    # A trigger that cannot fire (slug renamed, permission missing) must not
    # redden THIS build. The bump simply does not happen, and hub-status
    # shows the lock behind its tip -- which is the only signal there is, so
    # read it.
    soft_fail: true
    build:
      message: "agent-hub ${BUILDKITE_COMMIT} went green"
      env:
        HOMELAB_BUMP_INPUT: agent-hub
        HOMELAB_BUMP_REV: "${BUILDKITE_COMMIT}"
