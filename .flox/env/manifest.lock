    "hook": {
      "on-activate": "  # Where the GGUFs are. /srv/agent-hub/models on the box (the module's\n  # dataDir); a developer points this at a directory of their own.\n  : \"${AGENT_HUB_MODELS:=/srv/agent-hub/models}\"\n  # --threads / -t for every backend. 23 = the physical cores inside\n  # background.slice's fence on ac-box (hosts/ac-box/configuration.nix\n  # argues it); a laptop sets fewer. Never auto-detect: on the box that is\n  # 56 threads and the race servers starve.\n  : \"${AGENT_HUB_THREADS:=23}\"\n  # --ctx-size for the chat models. 32768 on the box; the embedding model\n  # has its own 8192 in llama-swap.yaml, as in the module.\n  : \"${AGENT_HUB_CTX:=32768}\"\n  # Where llama-swap listens. 127.0.0.1 because nginx owns the LAN side of\n  # :8100 on the box (the module's landingPage); a developer or a host\n  # without nginx puts the LAN address here.\n  : \"${AGENT_HUB_LISTEN:=127.0.0.1:8100}\"\n  # llama-swap's loopback backends start here. Not a LAN allocation, so not\n  # in homelab's port registry; chosen away from anything else on 127.0.0.1.\n  : \"${AGENT_HUB_BACKEND_PORT:=18100}\"\n  # The model table, and the directory holding sd-ui.html for the image\n  # backends. Both are files of this repo, not of the environment: a\n  # FloxHub generation carries the manifest and lock only, so wherever the\n  # environment runs from, the checkout has to be there too (or these two\n  # point elsewhere). Recorded as an ADR 0009 finding; not solved here.\n  : \"${AGENT_HUB_SWAP_CONFIG:=$FLOX_ENV_PROJECT/llama-swap.yaml}\"\n  : \"${AGENT_HUB_ASSETS:=$FLOX_ENV_PROJECT/nix}\"\n  export AGENT_HUB_MODELS AGENT_HUB_THREADS AGENT_HUB_CTX AGENT_HUB_LISTEN \\\n         AGENT_HUB_BACKEND_PORT AGENT_HUB_SWAP_CONFIG AGENT_HUB_ASSETS\n"
    },
    "options": {
      "systems": [
        "x86_64-linux"
      ]
    },
    "services": {
      "llm": {
        "command": "exec llama-swap -config \"$AGENT_HUB_SWAP_CONFIG\" -listen \"$AGENT_HUB_LISTEN\""
      }
    }
  },
