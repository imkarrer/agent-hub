      },
      "stable-diffusion-cpp": {
        "flake": "github:imkarrer/agent-hub#stable-diffusion-cpp"
      }
    },
    "hook": {
      "on-activate": "  if [ -z \"${INVOCATION_ID:-}\" ]; then\n    # A developer's shell, on a machine that is not the box. Every value\n    # here is deliberately NOT ac-box's (those are hosts/ac-box/\n    # configuration.nix's, passed by the stub): enough to load the table\n    # and run one small model beside a NixOS unit on the same machine.\n    #\n    # The GGUFs: models/ in this checkout, gitignored;\n    # `DEST=$PWD/models scripts/fetch-model.sh <name>` fills it.\n    : \"${AGENT_HUB_MODELS:=$FLOX_ENV_PROJECT/models}\"\n    # --threads / -t for every backend. Four: a laptop's share, never\n    # auto-detect (on the box that is 56 threads and the race servers\n    # starve; the box says 23).\n    : \"${AGENT_HUB_THREADS:=4}\"\n    # --ctx-size for the chat models (the box says 32768; the embedding\n    # model has its own 8192 in llama-swap.yaml regardless).\n    : \"${AGENT_HUB_CTX:=8192}\"\n    # Where llama-swap listens: loopback, and not :8100, which the NixOS\n    # unit on the WSL box holds (the box says 127.0.0.1:8100, nginx in\n    # front). scripts/ci_test.sh sets its own 18999 to sit beside this.\n    : \"${AGENT_HUB_LISTEN:=127.0.0.1:18900}\"\n    # llama-swap's loopback backends start here, off the box's 18100 for\n    # the same reason.\n    : \"${AGENT_HUB_BACKEND_PORT:=18910}\"\n    # The model table, and the directory holding sd-ui.html for the image\n    # backends: two files of this repo, at the checkout flox activated\n    # (FLOX_ENV_PROJECT). A FloxHub generation carries the manifest and\n    # lock only, which is why the box runs the tree at a sha (ADR 0009).\n    : \"${AGENT_HUB_SWAP_CONFIG:=$FLOX_ENV_PROJECT/llama-swap.yaml}\"\n    : \"${AGENT_HUB_ASSETS:=$FLOX_ENV_PROJECT/nix}\"\n    export AGENT_HUB_MODELS AGENT_HUB_THREADS AGENT_HUB_CTX AGENT_HUB_LISTEN \\\n           AGENT_HUB_BACKEND_PORT AGENT_HUB_SWAP_CONFIG AGENT_HUB_ASSETS\n  fi\n"
    },
    "options": {
      "systems": [
        "x86_64-linux"
      ]
    },
    "services": {
      "llm": {
        "command": "exec llama-swap -config \"$AGENT_HUB_SWAP_CONFIG\" -listen \"$AGENT_HUB_LISTEN\""
      }
    }
  },
