    "schema-version": "1.16.0",
    "install": {
      "curl": {
        "pkg-path": "curl"
      },
      "ik-llama-cpp": {
        "flake": "github:imkarrer/agent-hub#ik-llama-cpp"
      },
      "jq": {
        "pkg-path": "jq"
      },
      "llama-swap": {
        "pkg-path": "llama-swap",
        "version": "224"
